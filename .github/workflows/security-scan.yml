name: Security Scan

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  security-events: write
  contents: read

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: javascript

    - name: Autobuild
      uses: github/codeql-action/autobuild@v4

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4

  # 可選：添加其他安全檢查，如依賴掃描
  dependency-check:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Dependency Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: '資訊安全專案'
        path: '.'
        format: 'ALL'

  # 動態應用安全測試 (DAST) 使用 OWASP ZAP
  dast-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install backend dependencies
      working-directory: ./backend
      run: npm install

    - name: Start backend server in background
      working-directory: ./backend
      run: |
        # Set PORT to 3002 and start server in background
        export PORT=3002
        nohup npm start > server.log 2>&1 &
        echo "Server launch command executed, pid: $!"

    - name: Wait for backend application to be ready
      run: |
        echo "Waiting for server to start on port 3002..."
        timeout 120 bash -c 'until curl -s http://localhost:3002 > /dev/null; do sleep 5; echo "Retrying..."; done'
        echo "Server is up and running!"

    - name: Print server logs on failure
      if: failure() || cancelled()
      run: |
        echo "=== SERVER LOGS BEGIN ==="
        cat backend/server.log
        echo "=== SERVER LOGS END ==="

    - name: Run OWASP ZAP Full Scan
      uses: zaproxy/action-full-scan@v0.13.0
      with:
        target: 'http://localhost:3002'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        allow_issue_writing: false
        artifact_name: 'zap-scan-results'